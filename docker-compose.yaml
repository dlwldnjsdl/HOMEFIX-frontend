name: homefix-frontend-local

services:
  frontend:
    image: eagleindesert/homefix-frontend:local
    build:
      context: .
    ports:
      - "127.0.0.1:${FE_PORT:-8080}:80"
    environment:
      NGINX_ENDPOINT: "${NGINX_ENDPOINT:-/test}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://127.0.0.1:${FE_PORT:-8080}}"
      DOCKER_API_UPSTREAM: "${DOCKER_API_UPSTREAM:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
